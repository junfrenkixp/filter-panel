<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Filter panel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <ul class="filter-panel">
    <li class="filter-panel__item">
      <button class="filter-panel__button is-active">Все</button>
    </li>
    <li class="filter-panel__item">
      <button class="filter-panel__button">HTML</button>
    </li>
    <li class="filter-panel__item">
      <button class="filter-panel__button">CSS</button>
    </li>
    <li class="filter-panel__item">
      <button class="filter-panel__button">JavaScript</button>
    </li>
  </ul>

  <script>
    const buttons = document.querySelectorAll('.filter-panel__button');
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(button => button.classList.remove('is-active'))
        button.classList.add('is-active');
      })
    })
  </script>
</body>
</html>
